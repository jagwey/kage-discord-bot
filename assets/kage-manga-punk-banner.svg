<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1360 480" width="1360" height="480">
  <defs>
    <!-- Manga Halftone Nokta Deseni -->
    <pattern id="halftoneDot" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.8" fill="#222222"/>
    </pattern>
    <pattern id="denseDots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#e50914" opacity="0.35"/>
    </pattern>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a2b"/>
      <stop offset="100%" stop-color="#b3000f"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan: Mat Koyu Siyah -->
  <rect width="1360" height="480" fill="#0c0b0b"/>

  <!-- Manga Halftone Arka Plan Dokusu -->
  <rect width="1360" height="480" fill="url(#halftoneDot)"/>

  <!-- Kırmızı Dinamik Köşegen Bloklar (Manga Komik Şeritleri) -->
  <path d="M 0 0 L 320 0 L 220 480 L 0 480 Z" fill="#ff1a2b" opacity="0.12"/>
  <path d="M 980 0 L 1360 0 L 1360 480 L 1120 480 Z" fill="#ff1a2b" opacity="0.08"/>

  <!-- Halftone Vurgu Kutusu -->
  <rect x="780" y="40" width="460" height="90" fill="url(#denseDots)"/>

  <!-- Sol / Orta Taraf: Orijinal Kage 95 Amblem Vektörü (Oranlanmış) -->
  <g transform="translate(40, -20) scale(0.51)">
    <!-- Orijinal kage 95 logo SVG'sinin merkezi içeriği burada render edilir -->
    <image href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiIHdpZHRoPSIxMDI0IiBoZWlnaHQ9IjEwMjQiPjxwYXRoIGZpbGw9IiMwZjBmMGYiIG9wYWNpdHk9IjAiIGQ9Ik0wIDBMMTAyNCAwTDEwMjQgMTAyNEwwIDEwMjRMMCAwWiIvPjwvc3ZnPg==" width="1024" height="1024"/>
  </g>

  <!-- Kırmızı Koli Bandı / Hazard Tape Şeridi (Beyaz Kesikli Çizgili) -->
  <g transform="translate(40, 390) rotate(-4)">
    <rect width="320" height="38" fill="#ff1a2b" rx="2"/>
    <line x1="15" y1="19" x2="305" y2="19" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 10"/>
    <text x="160" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="4">KAGE OFFICIAL BOT</text>
  </g>

  <!-- Sağ Taraf: Büyük Tipografik Vurgu "KAGE 95" -->
  <g transform="translate(620, 160)">
    <!-- Beyaz Arka Plaka (Etiket efekti) -->
    <path d="M -20 -80 L 640 -80 L 610 140 L -50 140 Z" fill="#ffffff" transform="rotate(-1)"/>
    <path d="M -15 -75 L 635 -75 L 605 135 L -45 135 Z" fill="#0c0b0b" transform="rotate(-1)"/>

    <!-- KAGE Yazısı -->
    <text x="10" y="60" font-family="'Impact', 'Arial Black', sans-serif" font-size="150" font-weight="900" fill="#ffffff" letter-spacing="8">
      KAGE
    </text>
    <!-- 95 Rozeti (Kırmızı Kutu İçinde) -->
    <g transform="translate(420, -50)">
      <rect width="180" height="150" fill="#ff1a2b" rx="6"/>
      <rect x="0" y="0" width="180" height="24" fill="url(#halftoneDot)" opacity="0.6"/>
      <text x="90" y="115" font-family="'Impact', sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle">
        95
      </text>
      <!-- Küçük Barcode -->
      <g transform="translate(15, 126)" fill="#ffffff">
        <rect x="0" y="0" width="4" height="14"/>
        <rect x="8" y="0" width="8" height="14"/>
        <rect x="20" y="0" width="3" height="14"/>
        <rect x="28" y="0" width="10" height="14"/>
        <rect x="42" y="0" width="4" height="14"/>
        <rect x="50" y="0" width="7" height="14"/>
        <rect x="62" y="0" width="5" height="14"/>
        <rect x="72" y="0" width="12" height="14"/>
        <rect x="90" y="0" width="4" height="14"/>
        <rect x="98" y="0" width="9" height="14"/>
        <rect x="112" y="0" width="6" height="14"/>
        <rect x="124" y="0" width="10" height="14"/>
        <rect x="138" y="0" width="4" height="14"/>
      </g>
    </g>
  </g>

  <!-- Alt Barcode ve Bilgi Şeridi -->
  <g transform="translate(640, 360)">
    <rect width="240" height="60" fill="#ffffff" rx="3"/>
    <!-- Gerçekçi Barcode Çizgileri -->
    <g fill="#0c0b0b" transform="translate(15, 8)">
      <rect x="0" y="0" width="4" height="34"/>
      <rect x="8" y="0" width="6" height="34"/>
      <rect x="18" y="0" width="3" height="34"/>
      <rect x="25" y="0" width="9" height="34"/>
      <rect x="38" y="0" width="4" height="34"/>
      <rect x="46" y="0" width="7" height="34"/>
      <rect x="57" y="0" width="3" height="34"/>
      <rect x="64" y="0" width="12" height="34"/>
      <rect x="82" y="0" width="5" height="34"/>
      <rect x="92" y="0" width="8" height="34"/>
      <rect x="105" y="0" width="4" height="34"/>
      <rect x="113" y="0" width="11" height="34"/>
      <rect x="130" y="0" width="3" height="34"/>
      <rect x="137" y="0" width="6" height="34"/>
      <rect x="148" y="0" width="9" height="34"/>
      <rect x="162" y="0" width="4" height="34"/>
      <rect x="170" y="0" width="13" height="34"/>
      <rect x="188" y="0" width="5" height="34"/>
      <rect x="198" y="0" width="8" height="34"/>
      <text x="105" y="44" font-family="'Courier New', monospace" font-size="10" font-weight="900" text-anchor="middle">
        KAGE-95-DISCORD-SYSTEM
      </text>
    </g>

    <!-- Slogan Etiketi -->
    <g transform="translate(260, 10)">
      <text x="0" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" fill="#ffffff" letter-spacing="3">
        SESSIZCE OKU, DERINLERE IN
      </text>
      <text x="0" y="44" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ff1a2b" letter-spacing="4">
        HTTP://KAGE95.COM • INDIE GAME &amp; MANGA
      </text>
    </g>
  </g>

  <!-- Sol Taraf: Kırmızı İkonik "K" ve Samuray Silüeti Kompozisyonu -->
  <g transform="translate(180, 220)">
    <!-- Çapraz Kırmızı Blok -->
    <path d="M -80 -160 L 60 -160 L 160 160 L 20 160 Z" fill="#ff1a2b"/>
    <!-- Çapraz Beyaz Şerit -->
    <path d="M -30 -60 L 30 -60 L 110 60 L 50 60 Z" fill="#ffffff"/>
    <!-- Kılıç Üzerinde Kayan Ninja Silüeti -->
    <path d="M -120 100 Q 40 40 200 120 L 180 135 Q 40 60 -100 115 Z" fill="#ffffff"/>
    <circle cx="45" cy="55" r="16" fill="#0c0b0b"/>
    <path d="M 40 65 L 25 100 L 45 95 L 60 70 Z" fill="#0c0b0b"/>
    <path d="M 52 48 L 75 42 L 70 52 Z" fill="#0c0b0b"/> <!-- Uçuşan kafa bandı -->
  </g>

  <!-- Japonca Kanji Karakter "影" (KAGE / Gölge) - Arka Plan Graffiti Tarzı -->
  <text x="1220" y="420" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif" font-size="140" font-weight="900" fill="#ffffff" opacity="0.08" text-anchor="middle">
    影
  </text>
  <text x="120" y="160" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif" font-size="110" font-weight="900" fill="#ff1a2b" opacity="0.15" text-anchor="middle">
    矢
  </text>

  <!-- Üst/Alt Punk Çizgileri ve Konfetiler -->
  <circle cx="95" cy="65" r="12" fill="#ffffff"/>
  <circle cx="1280" cy="85" r="8" fill="#ff1a2b"/>
  <circle cx="560" cy="420" r="10" fill="#ffffff"/>
  <rect x="580" y="40" width="30" height="6" fill="#ffffff" transform="rotate(35 580 40)"/>
  <rect x="880" y="420" width="35" height="5" fill="#ff1a2b" transform="rotate(-25 880 420)"/>
</svg>
